services:
  postgres:
    image: postgres:16-alpine
    container_name: task-tracker-postgres
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tasktracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumed by docker/postgres-init/01-create-app-role.sh to provision a
      # least-privilege runtime role, separate from the POSTGRES_USER superuser.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      # Bound to loopback only — this is a backing store, not something meant
      # to be reachable from the network the host is on.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces a real TCP check. Without it, pg_isready talks to the unix socket, which the
      # temporary server used while docker-entrypoint-initdb.d scripts run already answers on —
      # reporting "healthy" before Postgres is actually listening for real connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tasktracker -d tasktracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - task-tracker-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: task-tracker-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Topics are created explicitly via NewTopic beans in KafkaTopicConfig;
      # auto-create is disabled so a typo'd topic name fails loudly instead of
      # silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - task-tracker-net

  app:
    build: .
    container_name: task-tracker-app
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tasktracker
      # Least-privilege runtime role (DML only) provisioned by
      # docker/postgres-init/01-create-app-role.sh; must match APP_DB_PASSWORD above.
      DB_USERNAME: app_runtime
      DB_PASSWORD: ${APP_DB_PASSWORD}
      # Flyway needs schema-owner rights for DDL, so it runs as the bootstrap superuser —
      # SPRING_FLYWAY_USER/PASSWORD is Spring's own relaxed-binding env var naming for
      # spring.flyway.user/password, no custom property indirection needed.
      SPRING_FLYWAY_USER: tasktracker
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      API_USERNAME: ${API_USERNAME}
      API_PASSWORD: ${API_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - task-tracker-net

networks:
  task-tracker-net:
    driver: bridge

volumes:
  pgdata:
