spring:
  application:
    name: task-tracker-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasktracker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Flyway runs DDL and needs schema-owner rights; the app's own datasource above should be
  # a least-privilege role (DML only). When spring.flyway.user isn't set, Boot's Flyway
  # autoconfiguration reuses the main datasource (url included) as-is — exactly what single-role
  # setups (tests, simple local runs) need. docker-compose overrides SPRING_FLYWAY_USER/PASSWORD
  # to point Flyway at the schema-owner role instead, without touching this file.
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000

  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via_dto

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

api:
  security:
    username: ${API_USERNAME}
    password: ${API_PASSWORD}
